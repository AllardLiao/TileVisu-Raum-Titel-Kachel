      }
      // Switches granular update
      for (let i = 1; i <= 5; i++) {
        const base = id + '-schalter' + i;
        // toggle showing labels inside multi-button group
        if (key === 'schalter' + i + 'showname' || key === 'Schalter' + i + 'ShowName') {
          const group = document.getElementById(base + '-group');
          const show = !(value === false || value === 0 || value === '0' || value === 'false');
          if (group) {
            group.classList.toggle('hide-labels', !show);
          }
          const btn = document.getElementById(base);
          if (btn) {
            btn.classList.toggle('hide-labels', !show);
            const nameEl = document.getElementById(base + 'name');
            const colon = document.getElementById(base + 'colon');
            const val = document.getElementById(base + 'asso');
            if (nameEl) nameEl.classList.toggle('hidden', !show);
            if (colon && nameEl && val) colon.classList.toggle('hidden', nameEl.classList.contains('hidden') || val.classList.contains('hidden'));
          }
          return;
        }
        // toggle showing values inside multi-button group
        if (key === 'schalter' + i + 'showvalue' || key === 'Schalter' + i + 'ShowValue') {
          const group = document.getElementById(base + '-group');
          const show = (value === true || value === 1 || value === '1' || value === 'true');
          if (group) {
            group.classList.toggle('hide-values', !show);
          }
          const btn = document.getElementById(base);
          const valEl = document.getElementById(base + 'asso');
          const colon = document.getElementById(base + 'colon');
          const name = document.getElementById(base + 'name');
          if (btn) btn.classList.toggle('hide-values', !show);
          if (valEl) {
            valEl.dataset.showvalue = show ? '1' : '0';
            valEl.classList.toggle('hidden', !show || (!valEl.textContent && valEl.textContent !== '0'));
          }
          if (colon && name && valEl) colon.classList.toggle('hidden', name.classList.contains('hidden') || valEl.classList.contains('hidden'));
          return;
        }
        // toggle showing icons inside multi-button group
        if (key === 'schalter' + i + 'showicon' || key === 'Schalter' + i + 'ShowIcon') {
          const group = document.getElementById(base + '-group');
          if (group) {
            const show = !(value === false || value === 0 || value === '0' || value === 'false');
            group.classList.toggle('hide-icons', !show);
          }
          return;
        }
        if (key === 'schalter' + i + 'name') {
          const el = document.getElementById(base + 'name');
          if (el) { el.textContent = value; el.classList.toggle('hidden', !value); }
          const colon = document.getElementById(base + 'colon');
          const val = document.getElementById(base + 'asso');
          if (colon && el && val) colon.classList.toggle('hidden', el.classList.contains('hidden') || val.classList.contains('hidden'));
          // ensure button visibility
          const btn = document.getElementById(base);
          if (btn) btn.classList.remove('hidden');
          return;
        }
        if (key === 'schalter' + i + 'asso') {
          const el = document.getElementById(base + 'asso');
          if (el) {
            el.textContent = value;
            const allowShow = !(el.dataset && el.dataset.showvalue === '0');
            const hide = (!value && value !== 0) || !allowShow;
            el.classList.toggle('hidden', hide);
          }
          const colon = document.getElementById(base + 'colon');
          const name = document.getElementById(base + 'name');
          if (colon && name && el) colon.classList.toggle('hidden', name.classList.contains('hidden') || el.classList.contains('hidden'));
          const btn = document.getElementById(base);
          if (btn) btn.classList.remove('hidden');
          return;
        }
        if (key === 'schalter' + i + 'icon') {
          const oldEl = document.getElementById(base + 'icon');
          if (oldEl) {
            if (value && value !== 'Transparent') {
              const cls = prepareIconClass(value);
              const newEl = setIconElementById(base + 'icon', cls ? (cls + ' switch-icon') : 'hidden switch-icon');
              if (newEl && !(newEl.className || '').includes('hidden')) {
                ensureFaSvg(newEl.parentElement || newEl);
              }
            } else {
              const newEl = setIconElementById(base + 'icon', 'hidden switch-icon');
              if (newEl) newEl.style.display = 'none';
            }
          }
          const btn = document.getElementById(base);
          if (btn) btn.classList.remove('hidden');
          return;
        }
        if (key === 'schalter' + i + 'color') {
          const btn = document.getElementById(base);
          if (btn && value) btn.style.backgroundColor = value;
          return;
        }
        if (key === 'schalter' + i + 'breite') {
          const btn = document.getElementById(base);
          if (btn && value) btn.style.minWidth = value + 'px';
          return;
        }
        if (key === 'schalter' + i + 'value') {
          // Update active state for multi-button groups
          const group = document.getElementById(base + '-group');
          if (group) {
            for (const child of group.children) {
              if (child && child.classList && child.classList.contains('switch-option')) {
                const isActive = (child.dataset && 'value' in child.dataset) ? (String(child.dataset.value) === String(value)) : false;
                child.classList.toggle('active', isActive);
                child.classList.toggle('inactive', !isActive);
              }
            }
          }
          const single = document.getElementById(base);
          if (single) {
            const isOn = (value === true || String(value) === '1');
            const isBool = (single.dataset && single.dataset.vartype === '0');
            if (isBool) {
              single.classList.toggle('inactive', !isOn);
              const colOn = single.dataset ? single.dataset.colorOn : undefined;
              const colOff = single.dataset ? single.dataset.colorOff : undefined;
              const fb = single.dataset ? single.dataset.fallbackcolor : undefined;
              let bg = isOn ? (colOn || fb || '') : (colOff || fb || '');
              if (!bg) bg = 'var(--accent-color)';
              single.style.backgroundColor = bg;
            }
          }
          return;
        }
        if (key === 'info' + i + 'value') {
          const infoBase = id + '-info' + i;
          const group = document.getElementById(infoBase + '-group');
          if (group) {
            for (const child of group.children) {
              if (child && child.classList && child.classList.contains('switch-option')) {
                const isActive = (child.dataset && 'value' in child.dataset) ? (String(child.dataset.value) === String(value)) : false;
                child.classList.toggle('active', isActive);
                child.classList.toggle('inactive', !isActive);
              }
            }
            return;
          }
        }
        // plain key fallback for switches (e.g., 'switch1')
        if (key === 'schalter' + i) {
          const el = document.getElementById(base + 'asso');
          if (el) { el.textContent = value; el.classList.toggle('hidden', !value && value !== 0); }
          const colon = document.getElementById(base + 'colon');
          const name = document.getElementById(base + 'name');
          if (colon && name && el) colon.classList.toggle('hidden', name.classList.contains('hidden') || el.classList.contains('hidden'));
          const btn = document.getElementById(base);
          if (btn) btn.classList.remove('hidden');
          return;
        }
      }
    }

    function setGlobalStyle(borderRadius, buttonHeight) {
      const root = document.documentElement;
      root.style.setProperty('--borderRadius', (borderRadius || 10) + 'px');
      if (buttonHeight !== undefined && buttonHeight !== null && !isNaN(Number(buttonHeight)) && Number(buttonHeight) > 0) {
        root.style.setProperty('--button-height', Number(buttonHeight) + 'px');
      }
    }

    function handleMessage(data) {
      const decoded = typeof data === 'string' ? JSON.parse(data) : (data || {});

      if (decoded.grid) {
        setGlobalStyle(decoded.grid.borderRadius, decoded.grid.buttonHeight);
        GRID_FLAGS.useImageColorsForButtons = !!decoded.grid.useImageColorsForButtons;
        if ('transparentStatusColors' in decoded.grid) {
          GRID_FLAGS.transparentStatusColors = !!decoded.grid.transparentStatusColors;
        }
        if ('transparentMenuStatusColors' in decoded.grid) {
          GRID_FLAGS.transparentMenuStatusColors = !!decoded.grid.transparentMenuStatusColors;
        }
        if ('groupMenuInfoElements' in decoded.grid) {
          GRID_FLAGS.groupMenuInfoElements = !!decoded.grid.groupMenuInfoElements;
        }
        if ('menuTransparency' in decoded.grid) {
          const mt = parseFloat(decoded.grid.menuTransparency);
          GRID_FLAGS.menuTransparency = isNaN(mt) ? 30 : mt;
        }
      }

      if (decoded.rooms) {
        // Full render (single room expected)
        const cont = document.getElementById('container');
        cont.innerHTML = '';
        decoded.rooms.forEach(r => {
          const t = ensureTile(r);
          applyRoomState(r);
        });
        return;
      }

      if (decoded.delta) {
        for (const d of decoded.delta) {
          updateRoomKey(d.idx, d.key, d.value);
        }
        return;
      }
    }
  </script>
</body>
