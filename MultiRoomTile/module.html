<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="/icons.js" crossorigin="anonymous"></script>
  <style>
    :root { --menu-padding: 8px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--minWidth, 300px), 1fr));
      gap: var(--gap, 12px);
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 0;
    }
    .tile {
      position: relative;
      min-height: var(--minHeight, 220px);
      background: var(--tilebackgroundcolor, #000);
      border-radius: var(--borderRadius, 10px);
      overflow: hidden;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    .tile-bg {
      position: absolute;
      inset: 0;
      background-position: bottom;
      background-repeat: no-repeat;
      background-size: cover;
      opacity: var(--imagetransparency, 0.7);
      z-index: 1;
      border-radius: var(--borderRadius, 10px);
    }
    .tile-bg2 {
      position: absolute;
      inset: 0;
      background-position: bottom;
      background-repeat: no-repeat;
      background-size: cover;
      z-index: 0;
      border-radius: var(--borderRadius, 10px);
    }

    .tile > :not(.tile-bg):not(.tile-bg2):not(.row-top):not(.center) { position: relative; z-index: 2; }

    .row-top {
      position: static;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: flex-start;
      padding: 8px;
      padding-bottom: 8px;
      flex-grow: 1;
    }

    .left, .right, .mid {
      display: flex;
      gap: 0;
      align-items: stretch;
      min-width: 0;
      min-height: 20px;
      flex: 0 0 auto;
      z-index: 3;
      padding: 0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 50px;
      width: fit-content;
      overflow: hidden;
    }
    .left { background-color: transparent; grid-column: 1; justify-self: start; }
    .mid { background-color: transparent; grid-column: 2; justify-self: center; }
    .right { background-color: transparent; grid-column: 3; justify-self: end; }
    .left.single-only, .right.single-only, .mid.single-only { justify-content: center; }
    .left.single-only .group, .right.single-only .group, .mid.single-only .group { margin-left: auto; margin-right: auto; }
    .left.single-only .group.only-icon, .right.single-only .group.only-icon, .mid.single-only .group.only-icon { width: 100%; justify-content: center; }

    .left:empty, .right:empty, .mid:empty {
      display: none;
    }

    .left .group, .right .group, .mid .group { 
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 4px 8px;
      background-color: var(--infotopleftbg, rgba(0,0,0,0.3));
      height: var(--infoheight, auto);
    }
    .menu-switches .group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .info-icon.solo {
      margin-right: 0;
      margin-left: 0;
    }
    .info-icon.svg-inline--fa, .switch-icon.svg-inline--fa { height: 1em; }
    .group.only-icon {
      gap: 0;
      justify-content: center;
    }
    .nv {
      display: inline;
    }
    .nv .info-name[id$="colon"] {
      white-space: pre;
    }
    
    .sep {
      width: 1px;
      align-self: stretch;
      background-color: var(--infofontcolor, #fff);
      display: none;
      min-height: 20px;
      flex-shrink: 0;
      opacity: 0.5;
    }

    /* Senkrechte Mitte: in der ganzen Kachel (Standard) oder zwischen den gemessenen Leisten */
    .center { 
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      z-index: 4;
    }
    .center.align-bars {
      top: var(--bar-top, 0px);
      bottom: var(--bar-bottom, 0px);
    }
    .center * {
      pointer-events: none;
    }
    .center .roomname { 
      margin: 0;
      line-height: 1.2; /* Verbesserte Lesbarkeit */
    }

    .menubar {
      backdrop-filter: blur(10px) brightness(1);
      -webkit-backdrop-filter: blur(10px) brightness(1);
      background-color: var(--menubackgroundcolor, rgba(0,0,0,0.3));
      color: var(--menufontcolor, #fff);
      display: flex;
      justify-content: flex-start;
      align-items: stretch;
      padding: var(--menu-padding, 6px);
      flex-shrink: 0;
      border-radius: 0 0 var(--borderRadius, 10px) var(--borderRadius, 10px);
    }
    .menubar.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .hidden { display: none !important; }

    .menu-switches { 
      --switch-gap: 10px;
      display: flex;
      align-items: stretch;
      gap: var(--switch-gap, 10px);
      flex-wrap: wrap;
      width: 100%;
      justify-content: flex-start;
    }
    .menu-switches > .switch-group, .menu-switches > .group { flex: 0 0 auto; }
    .menu-switches.align-left { justify-content: flex-start; margin-left: calc(-1 * var(--menu-padding, 12px)); padding-left: var(--menu-padding, 12px); }
    .menu-switches.align-center { justify-content: center; }
    .menu-switches.align-right { justify-content: flex-end; align-content: flex-end; gap: var(--switch-gap, 10px); margin-right: calc(-1 * var(--menu-padding, 12px)); padding-right: var(--menu-padding, 12px); }
    .menu-switches.align-right > * + * { margin-left: 0; }
    .menu-switches.distribute { justify-content: space-between; gap: var(--switch-gap, 10px); margin: 0 calc(-1 * var(--menu-padding, 12px)); padding: 0 var(--menu-padding, 12px); }
    .menu-switches.distribute .switch-group:has(.switch-option + .switch-option) { width: 100%; justify-content: space-between; }
    .menu-switches.distribute .switch-group .switch-option { flex: 1 1 0; }
    /* Full-width overrides for direct children - must come after alignment */
    .menu-switches > .switch-group.full-width,
    .menu-switches > .group.full-width { flex: 1 1 0; min-width: 0; width: auto; }
    .menu-switches .switch-group.full-width .switch { width: 100%; min-width: 0; }
    .menu-switches .switch-group.full-width .switch-option { flex: 1 1 0; min-width: 0; }
    .menu-switches .group.full-width .switch { width: 100%; min-width: 0; }
    /* Single button: keine erzwungene Vollbreite, damit Align greift */

    .info-name, .info-value { white-space: nowrap; }
    .row-top .info-name, .row-top .info-value { font-size: var(--infofontsize, 16px); }
    .menubar .info-name, .menubar .info-value { font-size: var(--menufontsize, 16px); }
    .row-top .group .info-name, .row-top .group .info-value { color: var(--infofontcolor, #fff); }
    .row-top .info-icon { font-size: calc(var(--infofontsize, 16px) * 0.966); color: var(--infofontcolor, #fff); }
    .menubar .info-icon, .menubar .switch-icon { font-size: calc(var(--menufontsize, 16px) * 0.966); color: var(--menufontcolor, #fff); }

    /* Fixed spacing for menu text items (no-action) */
    .menubar .group.no-action { padding: 0 12px; display: flex; align-items: center; justify-content: center; }
    .menubar .group.no-action .info-icon { margin-right: 0px; }
    /* Status background for no-action items - full height of menu bar */
    .menubar .group.no-action.has-status-bg {
      margin-top: calc(-1 * var(--menu-padding, 6px));
      margin-bottom: calc(-1 * var(--menu-padding, 6px));
      padding-top: var(--menu-padding, 6px);
      padding-bottom: var(--menu-padding, 6px);
      border-radius: 0;
      align-self: stretch;
    }
    /* No gap between adjacent no-action elements (when not grouped) */
    .menubar .group.no-action + .group.no-action {
      margin-left: calc(-1 * var(--switch-gap, 10px));
    }
    /* First/last no-action with status bg extends to tile edge */
    .menubar .group.no-action.has-status-bg:first-child {
      margin-left: calc(-1 * var(--menu-padding, 6px));
      padding-left: var(--menu-padding, 6px);
    }
    .menubar .group.no-action.has-status-bg:last-child {
      margin-right: calc(-1 * var(--menu-padding, 6px));
      padding-right: var(--menu-padding, 6px);
    }
    /* Icon-only: symmetric padding for centering */
    .menubar .group.no-action.icon-only.has-status-bg:first-child {
      padding-right: var(--menu-padding, 6px);
    }
    .menubar .group.no-action.icon-only.has-status-bg:last-child {
      padding-left: var(--menu-padding, 6px);
    }
    /* Grouped info elements container - treated as single element */
    .menubar .info-group-container {
      display: flex;
      align-items: stretch;
      gap: 0;
      padding: 0; /* outer padding comes from first/last item */
      flex-grow: 0 !important;
      flex-shrink: 0 !important;
      flex-basis: auto !important;
      align-self: stretch; /* fill bar height */
      background-color: transparent !important;
    }
    /* In distribute mode, push the grouped container to the right so it stays as one block */
    .menu-switches.distribute .info-group-container {
      margin-left: auto;
    }
    /* Remove flex gap before the grouped container in distribute mode (but not when right-aligned) */
    .menu-switches.distribute:not(.align-right) > *:has(+ .info-group-container) {
      margin-right: calc(-1 * var(--switch-gap, 10px));
    }
    /* Extend first/last grouped container to tile edge like ungrouped items */
    .menubar .info-group-container:first-child {
      margin-left: 0;
      padding-left: 0;
    }
    .menubar .info-group-container:first-child .info-group-item:first-child {
      padding-left: var(--menu-padding, 6px);
      margin-left: calc(-1 * var(--menu-padding, 6px));
    }
    /* Default: no right-edge compensation for grouped info */
    .menubar .info-group-container:last-child {
      margin-right: 0;
      padding-right: 0;
    }
    /* If first element is an ungrouped info item, extend to left tile edge
       for center/right alignment (align-left container already compensates) */
    .menu-switches.align-center .group.no-action:first-child,
    .menu-switches.align-right  .group.no-action:first-child {
      margin-left: calc(-1 * var(--menu-padding, 6px));
      padding-left: var(--menu-padding, 6px);
    }
    .menubar .info-group-container .info-group-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px; /* inner padding per chip */
      box-sizing: border-box;
      /* full bar height like ungrouped no-action */
      margin-top: calc(-1 * var(--menu-padding, 6px));
      margin-bottom: calc(-1 * var(--menu-padding, 6px));
      padding-top: var(--menu-padding, 6px);
      padding-bottom: var(--menu-padding, 6px);
      align-self: stretch;
    }
    .menubar .info-group-container .info-group-item:first-child { padding-left: 12px; }
    .menubar .info-group-container .info-group-item:last-child { padding-right: 12px; margin-right: 0; }
    /* When aligned right, outer container already compensates menubar padding.
       Do NOT apply inner negative margins/padding-right hacks. */
    .menu-switches.align-right .info-group-container:last-child {
      margin-right: 0;
      padding-right: 0;
    }
    .menu-switches.align-right .info-group-container .info-group-item:last-child {
      margin-right: 0;
      padding-right: 12px;
    }
    /* Distribute: last grouped info extends to right tile edge */
    .menu-switches.distribute .info-group-container:last-child {
      margin-right: 0;
      padding-right: 0;
    }
    /* When grouped info is last and aligned right or distribute, let the LAST item bleed to the edge */
    .menu-switches.align-right .info-group-container:last-child .info-group-item:last-child,
    .menu-switches.distribute .info-group-container:last-child .info-group-item:last-child {
      padding-right: var(--menu-padding, 6px);
      margin-right: calc(-1 * var(--menu-padding, 6px));
    }
    .menu-switches.align-right .info-group-container:last-child .info-group-item.icon-only:last-child,
    .menu-switches.distribute .info-group-container:last-child .info-group-item.icon-only:last-child {
      padding-left: var(--menu-padding, 6px);
    }
    /* Align-right: rely on flex gap, do not add extra margins */
    .menu-switches.align-right .group.no-action + .group.no-action {
      margin-left: 0;
    }
    .menu-switches.align-right .info-group-container + .group.no-action,
    .menu-switches.align-right .group.no-action + .info-group-container,
    .menu-switches.align-right .info-group-container + .info-group-container {
      margin-left: 0;
    }
    /* Align-right/Distribute: last ungrouped info extends to right tile edge */
    .menu-switches.align-right .group.no-action:last-child,
    .menu-switches.distribute .group.no-action:last-child {
      margin-right: calc(-1 * var(--menu-padding, 6px));
      padding-right: var(--menu-padding, 6px);
    }
    /* Icon-only last-child: symmetric padding for visual centering */
    .menu-switches.align-right .group.no-action.icon-only:last-child,
    .menu-switches.distribute .group.no-action.icon-only:last-child {
      padding-left: var(--menu-padding, 6px);
    }
    /* Keep first-badge neutralization for align-right (left side handled elsewhere) */
    .menu-switches.align-right .group.no-action.has-status-bg:first-child {
      margin-left: calc(-1 * var(--menu-padding, 6px));
      padding-left: var(--menu-padding, 6px);
    }
    /* Icon-only items: remove margin-right from icon for centering */
    .menubar .info-group-container .info-group-item.icon-only .info-icon { margin-right: 0; }
    /* Adjacent grouped items: no gap and draw a 1px divider on the following item */
    .menubar .info-group-container .info-group-item + .info-group-item {
      margin-left: 0;
      border-left: 1px solid rgba(255,255,255,0.35);
    }
    .menubar .info-group-container .info-group-item.has-status-bg + .info-group-item.has-status-bg { margin-left: 0; }
    .menubar .info-group-container .info-icon { margin-right: 6px; }
    /* Fallback (only in distribute, not when right-aligned): remove flex gap between grouped container and neighbors */
    .menu-switches.distribute:not(.align-right) .info-group-container + .group.no-action,
    .menu-switches.distribute:not(.align-right) .group.no-action + .info-group-container,
    .menu-switches.distribute:not(.align-right) .info-group-container + .info-group-container {
      margin-left: calc(-1 * var(--switch-gap, 10px));
    }
    /* Thin separator line between grouped items without adding gap */
    .info-group-container > .sep {
      display: block; /* override global .sep { display: none } */
      width: 1px;
      min-width: 1px;
      background-color: rgba(255,255,255,0.75);
      align-self: stretch;
      margin-top: calc(-1 * var(--menu-padding, 6px));
      margin-bottom: calc(-1 * var(--menu-padding, 6px));
      position: relative;
      z-index: 1;
  /*__TILEVISU_SHARED_CSS__*/
  </style>

<body>
  <div id="grid" class="grid"></div>

  <script>
  /*__TILEVISU_SHARED_JS__*/
    const iconMapping = window.iconMapping || {};
    // Global grid flags and per-room palettes
    const GRID_FLAGS = { useImageColorsForButtons: false, transparentStatusColors: true, transparentMenuStatusColors: true, groupMenuInfoElements: false };
    const IMAGE_PALETTES = {}; // key: room DOM id (e.g., 'room-0') -> array of colors
    // --- Helpers: Apply room InfoTop alpha to badge background colors ---
    function _getInfoTopAlpha(ref) {
      try {
        // ref can be roomObj (with infotopleftbg) or an Element (read CSS var)
        if (ref && typeof ref === 'object' && !('nodeType' in ref)) {
          return _parseAlphaFromRgba(ref.infotopleftbg, 0.3);
        }
        if (ref && ref.nodeType === 1) {
          const s = getComputedStyle(ref).getPropertyValue('--infotopleftbg');
          return _parseAlphaFromRgba(s, 0.3);
        }
      } catch {}
      return 0.3;
    }
    function applyMenuBadgeBg(grp, color, menuTransparency) {
      if (!grp) return;
      if (!color) { grp.style.backgroundColor = ''; return; }
      // global flag: opaque status colors when disabled
      if (GRID_FLAGS.transparentMenuStatusColors === false) {
        const c0 = String(color).trim();
        let out0 = c0;
        if (/^rgba\(/i.test(c0)) {
          out0 = c0.replace(/rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*[0-9.]+\s*\)/i, 'rgb($1, $2, $3)');
        }
        grp.style.backgroundColor = out0;
        return;
      }
      // Use menu transparency from room data (0% = unsichtbar, 100% = voll sichtbar)
      const a = (menuTransparency !== null && menuTransparency !== undefined && !isNaN(menuTransparency) ? menuTransparency : 30) / 100;
      const c = String(color).trim();
      let out = c;
      if (c.startsWith('#')) out = _hexToRgba(c, a);
      else if (/^rgb\(/i.test(c)) out = _rgbToRgba(c, a);
      else if (/^rgba\(/i.test(c)) {
        out = c.replace(/rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*[0-9.]+\s*\)/i, `rgba($1, $2, $3, ${a})`);
      }
      grp.style.backgroundColor = out;
    }

    async function loadImageForTile(url, bgEl) {
      if (!bgEl || !url) return null;
      bgEl.style.backgroundImage = 'url(' + url + ')';
      return url;
    }

    // --- Image palette extraction helpers ---
    async function extractPaletteFromDataUri(dataUri, maxColors = 8) {
      return new Promise(resolve => {
        try {
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d', { willReadFrequently: true });
              const w = 64;
              const h = Math.max(1, Math.round((img.height / img.width) * w));
              canvas.width = w; canvas.height = h;
              ctx.drawImage(img, 0, 0, w, h);
              const data = ctx.getImageData(0, 0, w, h).data;
              // coarse histogram in 16x16x16 bins
              const hist = new Map();
              for (let i = 0; i < data.length; i += 4) {
                const a = data[i + 3]; if (a < 32) continue; // skip transparent
                const r = data[i], g = data[i + 1], b = data[i + 2];
                const lum = _luminance(r, g, b);
                if (lum < 0.05 || lum > 0.97) continue; // ignore extremes
                const rb = r >> 4, gb = g >> 4, bb = b >> 4;
                const key = (rb << 8) | (gb << 4) | bb;
                hist.set(key, (hist.get(key) || 0) + 1);
              }
              const entries = Array.from(hist.entries()).sort((a, b) => b[1] - a[1]);
              const chosen = [];
              const isFar = (c1, c2) => {
                const dr = c1[0] - c2[0], dg = c1[1] - c2[1], db = c1[2] - c2[2];
                return (dr*dr + dg*dg + db*db) > 40*40; // ensure variety
              };
              for (const [key] of entries) {
                if (chosen.length >= maxColors) break;
                const rb = (key >> 8) & 0xF, gb = (key >> 4) & 0xF, bb = key & 0xF;
                let r = (rb << 4) + 8, g = (gb << 4) + 8, b = (bb << 4) + 8;
                [r, g, b] = _adjustLum(r, g, b);
                const cand = [r, g, b];
                if (chosen.length === 0 || chosen.every(c => isFar(c, cand))) {
                  chosen.push(cand);
                }
              }
              // fallback if none
              if (chosen.length === 0) {
                chosen.push([120, 120, 120]);
              }
              resolve(chosen.map(c => _rgbToHex(c[0], c[1], c[2])));
            } catch (e) { resolve([]); }
          };
          img.onerror = () => resolve([]);
          img.src = dataUri;
        } catch (e) { resolve([]); }
      });
    }

    function applyPaletteToRoom(room, palette) {
      if (!room || !palette || palette.length === 0) return;
      const id = 'room-' + room.idx;
      // apply to static switch groups/buttons
      for (let i = 1; i <= 5; i++) {
        const group = document.getElementById(id + '-schalter' + i + '-group');
        if (!group) continue;
        const options = room['schalter' + i + 'options'];
        if (Array.isArray(options) && options.length > 0) {
          const cols = colorsForCount(palette, options.length);
          let k = 0;
          for (const child of group.children) {
            if (child && child.classList && child.classList.contains('switch-option')) {
              child.style.backgroundColor = cols[k % cols.length];
              k++;
            }
          }
        } else {
          const hasAction = !!room['schalter' + i + 'hasaction'];
          if (!hasAction) continue;
          const btn = document.getElementById(id + '-schalter' + i);
          if (btn) {
            const baseCol = palette[0];
            btn.dataset.fallbackcolor = baseCol;
            if (btn.dataset && btn.dataset.vartype === '0') {
              btn.dataset.colorOn = baseCol;
              btn.dataset.colorOff = baseCol;
              const isOn = (room['schalter' + i + 'value'] === true || String(room['schalter' + i + 'value']) === '1');
              btn.style.backgroundColor = isOn ? btn.dataset.colorOn : btn.dataset.colorOff;
            } else {
              btn.style.backgroundColor = baseCol;
            }
          }
        }
      }
      // apply to dynamic menu items
      if (Array.isArray(room.menuitems)) {
        for (const it of room.menuitems) {
          const baseId = id + '-menuitem-' + it.id;
          const group = document.getElementById(baseId + '-group');
          if (!group) continue;
          if (Array.isArray(it.options) && it.options.length > 0) {
            const cols = colorsForCount(palette, it.options.length);
            let k = 0;
            for (const child of group.children) {
              if (child && child.classList && child.classList.contains('switch-option')) {
                child.style.backgroundColor = cols[k % cols.length];
                k++;
              }
            }
          } else {
            const btn = document.getElementById(baseId);
            if (btn && it.hasaction) {
              const baseCol = palette[0];
              btn.dataset.fallbackcolor = baseCol;
              if (btn.dataset && btn.dataset.vartype === '0') {
                btn.dataset.colorOn = baseCol;
                btn.dataset.colorOff = baseCol;
                const isOn = (btn.dataset.currentValue === 'true' || btn.dataset.currentValue === '1');
                btn.style.backgroundColor = isOn ? btn.dataset.colorOn : btn.dataset.colorOff;
              } else {
                btn.style.backgroundColor = baseCol;
              }
            }
          }
        }
      }
      // apply to dynamic info switch groups if present
      if (Array.isArray(room.infoitems)) {
        for (const it of room.infoitems) {
          const group = document.getElementById(id + '-' + it.key + '-group');
          if (!group) continue;
          if (Array.isArray(it.options) && it.options.length > 0) {
            const cols = colorsForCount(palette, it.options.length);
            let k = 0;
            for (const child of group.children) {
              if (child && child.classList && child.classList.contains('switch-option')) {
                child.style.backgroundColor = cols[k % cols.length];
                k++;
              }
            }
          }
        }
      }
    }

    function updateBadgeMinWidth(prefixId) {
      const root = document.getElementById(prefixId);
      if (!root) return;
      const els = [root.querySelector('.left'), root.querySelector('.mid'), root.querySelector('.right')];
      for (const el of els) {
        if (!el) continue;
        // Reset width overrides
        el.style.width = '';
        el.style.minWidth = '';
        // Determine visible groups and if single-only-icon case
        const allGroups = Array.from(el.querySelectorAll('.group'));
        const visibleGroups = allGroups.filter(g => g.style.display !== 'none' && g.offsetParent !== null);
        const isSingle = visibleGroups.length === 1;
        const isOnlyIcon = isSingle && visibleGroups[0].classList.contains('only-icon');
        // Remove/add side padding for single-only state
        if (isOnlyIcon) {
          el.style.paddingLeft = '0px';
          el.style.paddingRight = '0px';
        } else {
          el.style.paddingLeft = '';
          el.style.paddingRight = '';
        }
        // Measure height after potential padding change
        const h = el.getBoundingClientRect().height;
        if (h > 0) {
          if (isOnlyIcon) {
            // Make badge square: width = height
            const size = Math.ceil(h);
            el.style.width = size + 'px';
            el.style.minWidth = size + 'px';
            // Center the only group fully
            visibleGroups[0].style.minWidth = '100%';
            visibleGroups[0].style.justifyContent = 'center';
          } else {
            // For general case keep pill min width equal to height
            el.style.minWidth = Math.ceil(h) + 'px';
            // Reset group overrides
            allGroups.forEach(g => { g.style.minWidth = ''; });
          }
        }
      }
    }

    function renderInfoSwitchGroup(prefixId, idx, n, options, currentValue, fallbackColor, widthPx, fullWidth) {
      const group = document.getElementById(prefixId + '-info' + n + '-group');
      if (!group) return;

          if (opt.color) btn.style.backgroundColor = opt.color; else if (fallbackColor) btn.style.backgroundColor = fallbackColor;
          if (widthPx) btn.style.minWidth = widthPx + 'px';
          if (icon.className.indexOf('hidden') === -1) btn.appendChild(icon);

    function ensureTile(room) {
      const grid = document.getElementById('grid');
      const id = 'room-' + room.idx;
      let tile = document.getElementById(id);
      if (tile) return tile;

      tile = el('div', { id, class: 'tile' });

      const mid = el('div', { class: 'mid' });
      const right = el('div', { class: 'right' });

      const createGroup = (key) => {
         const g = groupInfo(id, key);

      row.appendChild(mid);
      row.appendChild(right);
      tile.appendChild(row);

      // center roomname (as overlay inside tile)
      const center = el('div', { class: 'center' });
      const rn = el('p', { id: id + '-roomname', class: 'roomname' }, '');
      center.appendChild(rn);
      tile.appendChild(center);

      // menubar
      const menu = el('div', { id: id + '-menubar', class: 'menubar' + (room.menuswitch ? '' : ' is-hidden') });
      const switchContainer = el('div', { id: id + '-switches', class: 'menu-switches align-left' });
      for (let i = 1; i <= 5; i++) {
        const configured = !!room['schalter' + i + 'configured'];
        if (!configured) continue;
        const type = room['schalter' + i + 'type'];
        const options = room['schalter' + i + 'options'];
        const hasAction = !!room['schalter' + i + 'hasaction'];
        const openObjectId = Number(room['schalter' + i + 'openobject'] || 0);

        } else {

      menu.appendChild(switchContainer);
      tile.appendChild(menu);

      grid.appendChild(tile);
      observeTileBars(tile);

    function renderDynamicInfo(prefixId, roomObj) {
      const root = document.getElementById(prefixId);
      if (!root) return;
      const row = root.querySelector('.row-top');
      if (!row) return;
      const left = row.querySelector('.left');
      const centered = !!roomObj.infotopcentered;
      const mid = row.querySelector('.mid');
      const right = row.querySelector('.right');
      if (!left || !mid || !right) return;
      root.dataset.hasDynamicInfo = '1';

      left.innerHTML = '';
      mid.innerHTML = '';
      right.innerHTML = '';

      const items = Array.isArray(roomObj.infoitems) ? roomObj.infoitems.slice().sort((a, b) => (a.order || 0) - (b.order || 0)) : [];
      const leftItems = items.filter(it => (it.area || 'left') === 'left');
      const midItems = items.filter(it => (it.area || 'left') === 'mid');
      const rightItems = items.filter(it => (it.area || 'left') === 'right');
      
      const processItem = (it, idx, g) => {
         if (it.color) {
            applyBadgeBg(g, it.color, roomObj);
         }
      };

      const build = (container, list, alignTarget) => {
        container.style.display = list.length ? '' : 'none';
        list.forEach((it, idx) => {
          const g = groupInfo(prefixId, it.key);
          processItem(it, idx, g);
          container.appendChild(g);
          applyInfo(prefixId, it.key, roomObj);
          if (idx < list.length - 1) {
            container.appendChild(el('div', { class: 'sep', style: 'display:block;' }));
          }
        });
        const visibleGroups = container.querySelectorAll('.group');
        const exactlyOne = visibleGroups.length === 1;
        container.style.justifyContent = exactlyOne ? 'center' : alignTarget;
        container.classList.toggle('single-only', exactlyOne);
      };

      if (centered) {
        const combined = [].concat(leftItems, midItems, rightItems);
        build(mid, combined, 'center');
        left.style.display = 'none';
        right.style.display = 'none';
      } else {
        build(left, leftItems, 'flex-start');
        build(mid, midItems, 'center');
        build(right, rightItems, 'flex-start');
      }
      updateBadgeMinWidth(prefixId);
    }

    function renderDynamicMenu(prefixId, roomObj) {
      const cont = document.getElementById(prefixId + '-switches');
      if (!cont) return;
      cont.innerHTML = '';
      const items = Array.isArray(roomObj.menuitems) ? roomObj.menuitems.slice().sort((a, b) => (a.order || 0) - (b.order || 0)) : [];
      const useImgCol = (roomObj.useimagecolors === true || GRID_FLAGS.useImageColorsForButtons);

      // Pre-scan grouping: create a single info group at the position of the first no-action item
      // Use per-room setting if available, fallback to global flag
      const groupingEnabled = (roomObj.groupmenuinfoelements !== undefined) ? !!roomObj.groupmenuinfoelements : !!GRID_FLAGS.groupMenuInfoElements;
      const sorted = items;
      const noActionIdxs = groupingEnabled ? sorted.map((it, idx) => (!it.hasaction ? idx : -1)).filter(i => i >= 0) : [];
      const firstNoActionIdx = noActionIdxs.length > 0 ? noActionIdxs[0] : -1;
      let infoGroupContainer = (groupingEnabled && firstNoActionIdx >= 0) ? el('div', { class: 'group info-group-container' }) : null;

      for (let i = 0; i < sorted.length; i++) {
        const it = sorted[i];
        const baseId = prefixId + '-menuitem-' + it.id;
        const key = it.key;
        const hasOptions = Array.isArray(it.options) && it.options.length > 0 && it.hasaction && (it.action === 'variable' || it.action === 'scenecontrol');
        const isObjectAction = it.action === 'object' && it.openObjectId > 0 && typeof openObject === 'function';

        // Insert info group container at the first no-action position
        if (infoGroupContainer && i === firstNoActionIdx) {
          cont.appendChild(infoGroupContainer);
        }

        if (hasOptions) {
          const group = el('div', { id: baseId + '-group', class: 'switch-group' + (it.fullWidth ? ' full-width' : '') });
          group.classList.toggle('hide-labels', it.showName === false);
          group.classList.toggle('hide-values', it.showValue !== true);
          group.classList.toggle('hide-icons', it.showIcon === false);
          const optWidth = (it.width && !it.fullWidth) ? (it.width | 0) : 0;
          for (const opt of it.options) {
            const val = (opt.value !== undefined) ? opt.value : (opt.Value !== undefined ? opt.Value : opt);
            const label = (opt.label !== undefined) ? opt.label : (opt.Name !== undefined ? opt.Name : String(val));
            const btn = el('button', {
              class: 'switch-option' + (String(it.value) === String(val) ? ' active' : ' inactive'),
              onclick: `requestAction('menuitem:${it.id}', ${JSON.stringify(val)})`,
              'data-value': String(val)
            });
            if (it.showIcon !== false && opt.icon) {
              const cls = prepareIconClass(opt.icon);
              if (cls) {
                const icon = el('i', { class: cls + ' switch-icon' });
                btn.appendChild(icon);
                ensureFaSvg(btn);
              }
            }
            btn.appendChild(el('span', { class: 'info-name' }, label ?? ''));
            btn.appendChild(el('span', { class: 'info-value' }, String(val ?? '')));
            if (!useImgCol) {
              if (opt.color) btn.style.backgroundColor = opt.color;
              else if (it.color) btn.style.backgroundColor = it.color;
            }
            if (optWidth > 0) btn.style.minWidth = optWidth + 'px';
            group.appendChild(btn);
          }
          cont.appendChild(group);
        } else {
          const isNoAction = !it.hasaction;
          if (isNoAction) {
            // Append to the single info group when enabled; otherwise legacy behavior
            if (infoGroupContainer) {
              const innerEl = el('span', { id: baseId + '-inner', class: 'info-group-item' });
              const hasStatusBg = it.useVarColor && it.statusBgColor;
              if (hasStatusBg) {
                innerEl.dataset.statusbgcolor = it.statusBgColor;
                applyMenuBadgeBg(innerEl, it.statusBgColor, roomObj.menueimagetransparency);
                innerEl.classList.add('has-status-bg');
              }
              if (it.showIcon !== false && roomObj[`${key}icon`]) {
                const cls = prepareIconClass(roomObj[`${key}icon`]);
                if (cls) {
                  const icon = el('i', { id: baseId + 'icon', class: cls + ' info-icon' });
                  innerEl.appendChild(icon);
                  ensureFaSvg(innerEl);
                }
              }
              const label = roomObj[`${key}name`] || '';
              const value = roomObj[`${key}asso`] ?? roomObj[`${key}`] ?? '';
              const showLabelVis = (it.showName !== false) && !!label;
              const showValVis = (it.showValue === true && (value || value === 0));
              if (showLabelVis || showValVis) {
                const textWrap = el('span', { class: 'nv' });
                textWrap.appendChild(el('span', { id: baseId + 'name', class: 'info-name' + (showLabelVis ? '' : ' hidden') }, label));
                const colonCls = (showLabelVis && showValVis) ? 'info-name' : 'info-name hidden';
                textWrap.appendChild(el('span', { id: baseId + 'colon', class: colonCls }, ': '));
                textWrap.appendChild(el('span', { id: baseId + 'asso', class: 'info-value' + (showValVis ? '' : ' hidden') }, String(value)));
                innerEl.appendChild(textWrap);
              } else {
                innerEl.classList.add('icon-only');
              }
              // Add visual separator only inside grouped container
              if (infoGroupContainer.childElementCount > 0) {
                infoGroupContainer.appendChild(el('div', { class: 'sep' }));
              }
              infoGroupContainer.appendChild(innerEl);
            } else {
              // Original ungrouped behavior
              const hasStatusBg = it.useVarColor && it.statusBgColor;
              const wrapper = el('div', { id: baseId + '-group', class: 'group no-action' + (it.fullWidth ? ' full-width' : '') + (hasStatusBg ? ' has-status-bg' : '') });
              if (hasStatusBg) {
                wrapper.dataset.statusbgcolor = it.statusBgColor;
                applyMenuBadgeBg(wrapper, it.statusBgColor, roomObj.menueimagetransparency);
              }
              if (it.showIcon !== false && roomObj[`${key}icon`]) {
                const cls = prepareIconClass(roomObj[`${key}icon`]);
                if (cls) {
                  const icon = el('i', { id: baseId + 'icon', class: cls + ' info-icon' });
                  wrapper.appendChild(icon);
                  ensureFaSvg(wrapper);
                }
              }
              const label = roomObj[`${key}name`] || '';
              const value = roomObj[`${key}asso`] ?? roomObj[`${key}`] ?? '';
              const showLabelVis = (it.showName !== false) && !!label;
              const showValVis = (it.showValue === true && (value || value === 0));
              if (showLabelVis || showValVis) {
                const textWrap = el('span', { class: 'nv' });
                textWrap.appendChild(el('span', { id: baseId + 'name', class: 'info-name' + (showLabelVis ? '' : ' hidden') }, label));
                const colonCls = (showLabelVis && showValVis) ? 'info-name' : 'info-name hidden';
                textWrap.appendChild(el('span', { id: baseId + 'colon', class: colonCls }, ': '));
                textWrap.appendChild(el('span', { id: baseId + 'asso', class: 'info-value' + (showValVis ? '' : ' hidden') }, String(value)));
                wrapper.appendChild(textWrap);
              } else {
                wrapper.classList.add('icon-only');
              }
              cont.appendChild(wrapper);
            }
          } else {
            // Action button (not hasOptions)
            const btnAttrs = { id: baseId, class: 'switch' };
            if (it.fullWidth) btnAttrs.class += ' full-width';
            const btn = el('button', btnAttrs);
            if (it.type !== undefined) btn.dataset.vartype = String(it.type);
            if (!useImgCol) {
              if (it.colorOn) btn.dataset.colorOn = it.colorOn;
              if (it.colorOff) btn.dataset.colorOff = it.colorOff;
              if (it.color) btn.dataset.fallbackcolor = it.color;
            }
            btn.dataset.currentValue = String(it.value ?? '');
            if (isObjectAction) {
              btn.onclick = () => openObject(Number(it.openObjectId));
            } else if (it.type === 0) {
              const isOn = (it.value === true || String(it.value) === '1');
              btn.classList.toggle('inactive', !isOn);
              if (!useImgCol) {
                let bg = isOn ? (it.colorOn || it.color || '') : (it.colorOff || it.color || '');
                if (bg) btn.style.backgroundColor = bg;
              }
              btn.onclick = () => {
                const wasOn = btn.dataset.currentValue === 'true' || btn.dataset.currentValue === '1';
                const newVal = !wasOn;
                btn.dataset.currentValue = String(newVal);
                btn.classList.toggle('inactive', !newVal);
                if (!useImgCol) {
                  const colOn = btn.dataset ? btn.dataset.colorOn : undefined;
                  const colOff = btn.dataset ? btn.dataset.colorOff : undefined;
                  const fb = btn.dataset ? btn.dataset.fallbackcolor : undefined;
                  let bg = newVal ? (colOn || it.colorOn || it.color || fb || '') : (colOff || it.colorOff || it.color || fb || '');
                  if (bg) btn.style.backgroundColor = bg;
                }
                requestAction('menuitem:' + it.id, newVal);
              };
            } else {
              if (!useImgCol && it.color) btn.style.backgroundColor = it.color;
              if (it.range) {
                // Dimmer: Tippen schaltet um, Streichen stellt einen Wert ein
                bindSwipeDimmer(btn, 'menuitemset:' + it.id, it.range, it.type, it.value);
                btn.onclick = () => { if (!consumeDimClick(btn)) requestAction('menuitem:' + it.id, 1); };
              } else {
                btn.onclick = () => requestAction('menuitem:' + it.id, 1);
                updateNumericButtonState(btn, it.value);
              }
            }
            if (it.showIcon !== false && roomObj[`${key}icon`]) {
              const cls = prepareIconClass(roomObj[`${key}icon`]);
              if (cls) {
                const icon = el('i', { id: baseId + 'icon', class: cls + ' switch-icon' });
                btn.appendChild(icon);
                ensureFaSvg(btn);
              }
            }
            const textWrap = el('span', { class: 'nv' });
            const label = roomObj[`${key}name`] || '';
            const value = roomObj[`${key}asso`] ?? roomObj[`${key}`] ?? '';
            const showLabel = it.showName !== false || isObjectAction;
            const showLabelVis = (showLabel && !!label);
            textWrap.appendChild(el('span', { id: baseId + 'name', class: 'info-name' + (showLabelVis ? '' : ' hidden') }, label));
            const showValVis = (!isObjectAction && it.showValue === true && (value || value === 0));
            const colonCls = (showLabelVis && showValVis) ? 'info-name' : 'info-name hidden';
            textWrap.appendChild(el('span', { id: baseId + 'colon', class: colonCls }, ': '));
            textWrap.appendChild(el('span', { id: baseId + 'asso', class: 'info-value' + (showValVis ? '' : ' hidden') }, String(value)));
            btn.appendChild(textWrap);
            const wrapper = el('div', { id: baseId + '-group', class: 'group' + (it.fullWidth ? ' full-width' : '') });
            wrapper.appendChild(btn);
            cont.appendChild(wrapper);
          }
        }
      }
      // groups are inserted on-the-fly in order
      updateSingleButtonState(prefixId);
      normalizeDistribute(prefixId);
      setSwitchAlignment(prefixId, roomObj.switchalignment, !!roomObj.switchdistribute);
    }

    function updateInfoContainerVisibility(prefixId) {
      const root = document.getElementById(prefixId);
      if (!root) return;
      const row = root.querySelector('.row-top');
      if (!row) return;
      const left = row.querySelector('.left');
      const mid = row.querySelector('.mid');
      const right = row.querySelector('.right');
      if (root.dataset.hasDynamicInfo === '1') {
        if (left) {
          const groups = Array.from(left.querySelectorAll('.group'));
          const anyLeft = groups.length > 0;
          left.style.display = anyLeft ? '' : 'none';
          const exactlyOneLeft = groups.length === 1;
          left.style.justifyContent = exactlyOneLeft ? 'center' : 'flex-start';
          left.classList.toggle('single-only', exactlyOneLeft);
        }
        if (mid) {
          const groups = Array.from(mid.querySelectorAll('.group'));
          const anyMid = groups.length > 0;
          mid.style.display = anyMid ? '' : 'none';
          const exactlyOneMid = groups.length === 1;
          mid.style.justifyContent = exactlyOneMid ? 'center' : 'center';
          mid.classList.toggle('single-only', exactlyOneMid);
        }
        if (right) {
          const groups = Array.from(right.querySelectorAll('.group'));
          const anyRight = groups.length > 0;
          right.style.display = anyRight ? '' : 'none';
          const exactlyOneRight = groups.length === 1;
          right.style.justifyContent = exactlyOneRight ? 'center' : 'flex-start';
          right.classList.toggle('single-only', exactlyOneRight);
        }
        updateBadgeMinWidth(prefixId);
        return;
      }
      // Legacy mode
      if (root.dataset.topCentered === '1' && mid) {
        const has1 = isGroupVisible(prefixId, 'infoleft');
        const has2 = isGroupVisible(prefixId, 'infoleft2');
        const has3 = isGroupVisible(prefixId, 'inforight');
        const has4 = isGroupVisible(prefixId, 'inforight2');
        const gEls = mid.querySelectorAll('.group');
        if (gEls[0]) gEls[0].style.display = has1 ? '' : 'none';
        if (gEls[1]) gEls[1].style.display = has2 ? '' : 'none';
        if (gEls[2]) gEls[2].style.display = has3 ? '' : 'none';
        if (gEls[3]) gEls[3].style.display = has4 ? '' : 'none';
        const sep1 = document.getElementById(prefixId + '-sep-mid-1');
        const sep2 = document.getElementById(prefixId + '-sep-mid-2');
        const sep3 = document.getElementById(prefixId + '-sep-mid-3');
        if (sep1) sep1.style.display = (has1 && has2) ? 'block' : 'none';
        if (sep2) sep2.style.display = (has2 && has3) ? 'block' : 'none';
        if (sep3) sep3.style.display = (has3 && has4) ? 'block' : 'none';
        mid.style.display = (has1 || has2 || has3 || has4) ? '' : 'none';
        left && (left.style.display = 'none');
        right && (right.style.display = 'none');
        return;
      }
      if (left) {
        let sepL = document.getElementById(prefixId + '-sep-left');
        if (!sepL) {
          sepL = el('div', { id: prefixId + '-sep-left', class: 'sep sep-left' });
          const children = Array.from(left.children);
          const firstGroupIdx = children.findIndex(n => n.classList && n.classList.contains('group'));
          if (firstGroupIdx !== -1 && firstGroupIdx + 1 <= children.length) {
            left.insertBefore(sepL, children[firstGroupIdx + 1] || null);
          } else {
            left.appendChild(sepL);
          }
        }
        const hasLeft1 = isGroupVisible(prefixId, 'infoleft');
        const hasLeft2 = isGroupVisible(prefixId, 'infoleft2');
        const leftGroups = left.querySelectorAll('.group');
        if (leftGroups[0]) leftGroups[0].style.display = hasLeft1 ? '' : 'none';
        if (leftGroups[1]) leftGroups[1].style.display = hasLeft2 ? '' : 'none';
        const anyLeft = hasLeft1 || hasLeft2;
        left.style.display = anyLeft ? '' : 'none';
        if (sepL) sepL.style.display = (hasLeft1 && hasLeft2) ? 'block' : 'none';
        // Center content if exactly one group is visible on the left
        const exactlyOneLeft = (hasLeft1 && !hasLeft2) || (!hasLeft1 && hasLeft2);
        left.style.justifyContent = exactlyOneLeft ? 'center' : 'flex-start';
        left.classList.toggle('single-only', exactlyOneLeft);
      }
      if (right) {
        let sepR = document.getElementById(prefixId + '-sep-right');
        if (!sepR) {
          sepR = el('div', { id: prefixId + '-sep-right', class: 'sep sep-right' });
          const children = Array.from(right.children);
          const firstGroupIdx = children.findIndex(n => n.classList && n.classList.contains('group'));
          if (firstGroupIdx !== -1 && firstGroupIdx + 1 <= children.length) {
            right.insertBefore(sepR, children[firstGroupIdx + 1] || null);
          } else {
            right.appendChild(sepR);
          }
        }
        const hasRight1 = isGroupVisible(prefixId, 'inforight');
        const hasRight2 = isGroupVisible(prefixId, 'inforight2');
        const rightGroups = right.querySelectorAll('.group');
        if (rightGroups[0]) rightGroups[0].style.display = hasRight1 ? '' : 'none';
        if (rightGroups[1]) rightGroups[1].style.display = hasRight2 ? '' : 'none';
        const anyRight = hasRight1 || hasRight2;
        right.style.display = anyRight ? '' : 'none';
        if (sepR) sepR.style.display = (hasRight1 && hasRight2) ? 'block' : 'none';
        // Center content if exactly one group is visible on the right
        const exactlyOneRight = (hasRight1 && !hasRight2) || (!hasRight1 && hasRight2);
        right.style.justifyContent = exactlyOneRight ? 'center' : 'flex-start';
        right.classList.toggle('single-only', exactlyOneRight);
      }
    }

    function setSwitchAlignment(prefixId, alignment, distribute) {
      const cont = document.getElementById(prefixId + '-switches');
      if (!cont) return;
      // preserve existing alignment if undefined
      let align = alignment;
      if (!align) {
        if (cont.classList.contains('align-center')) align = 'center';
        else if (cont.classList.contains('align-right')) align = 'right';
        else align = 'left';
      }
      cont.classList.remove('align-left', 'align-center', 'align-right');
      cont.classList.add('align-' + align);
      if (distribute === true) cont.classList.add('distribute');
      if (distribute === false) cont.classList.remove('distribute');
    }

    function applyRoomState(room) {
      const id = 'room-' + room.idx;
      const root = document.getElementById(id);
      if (!root) return;

      root.dataset.useimagecolors = (room.useimagecolors === true || GRID_FLAGS.useImageColorsForButtons) ? '1' : '0';
      // Menü-Transparenz am Root hinterlegen, damit der statusbgcolor-Delta-Handler die
      // Badge-Farbe mit korrektem Alpha nachziehen kann (ohne Voll-Render).
      root.dataset.menutransparency = String((room.menueimagetransparency !== undefined && room.menueimagetransparency !== null) ? room.menueimagetransparency : 30);

      // Click-Handling: nur der freie Bereich zwischen Infoleiste (row-top) und Menüleiste
      root.onclick = null;
      const menuEl = document.getElementById(id + '-menubar');
      if (menuEl) {
        menuEl.onclick = (e) => { e.stopPropagation(); };
        menuEl.style.cursor = 'default';
      }
      const rowEl = root.querySelector('.row-top');
      if (rowEl) {
        rowEl.onclick = (e) => { e.stopPropagation(); };
        rowEl.style.cursor = 'default';
      }
      if (room.targetlink && Number(room.targetlink) > 1 && typeof openObject === 'function') {
        const target = Number(room.targetlink);
        root.style.cursor = 'pointer';
        root.onclick = () => openObject(target);
      } else if (room.targetlinkid && Number(room.targetlinkid) > 0 && room.targetlinkvalue && Number(room.targetlinkvalue) > 0) {
        root.style.cursor = 'pointer';
        root.onclick = () => requestAction('setlink', JSON.stringify({ linkId: Number(room.targetlinkid), targetId: Number(room.targetlinkvalue) }));
      } else {
        root.style.cursor = '';
      }

      // Grid-independent styling per room
      root.style.setProperty('--tilebackgroundcolor', room.tilebackgroundcolor || '#000');
      root.style.setProperty('--menubackgroundcolor', room.menubackgroundcolor || 'rgba(0,0,0,0.3)');
      root.style.setProperty('--menufontcolor', room.menufontcolor || '#fff');
      root.style.setProperty('--menufontsize', (room.menufontsize || 16) + 'px');
      root.style.setProperty('--infofontsize', (room.infofontsize || 16) + 'px');
      root.style.setProperty('--infofontcolor', room.infofontcolor || '#fff');
      root.style.setProperty('--imagetransparency', room.imagetransparency ?? 0.7);
      if (room.infoheight && Number(room.infoheight) > 0) {
        root.style.setProperty('--infoheight', room.infoheight + 'px');
      } else {
        root.style.removeProperty('--infoheight');
      }
      // Info-Top Badge BGs
      if (room.infotopleftbg) root.style.setProperty('--infotopleftbg', room.infotopleftbg);
      if (room.infomidbg) root.style.setProperty('--infomidbg', room.infomidbg);
      if (room.infotoprightbg) root.style.setProperty('--infotoprightbg', room.infotoprightbg);

      // Background images (+ optional palette -> button colors)
      if (room.image1) {
        const bg = document.getElementById(id + '-bg');
        if (bg) {
          // store fade/base settings
          bg.dataset.basealpha = String((typeof room.imagetransparency === 'number') ? room.imagetransparency : 0.7);
          bg.dataset.image2enabled = room.image2enabled ? '1' : '0';
          if (room.bgfilterbrightnessmin !== undefined) bg.dataset.bmin = String(room.bgfilterbrightnessmin);
          if (room.bgfilterbrightnessmax !== undefined) bg.dataset.bmax = String(room.bgfilterbrightnessmax);
          if (room.bgfiltercontrastmin !== undefined) bg.dataset.cmin = String(room.bgfiltercontrastmin);
          if (room.bgfiltercontrastmax !== undefined) bg.dataset.cmax = String(room.bgfiltercontrastmax);
          if (room.bgfiltergrayscalemin !== undefined) bg.dataset.gmin = String(room.bgfiltergrayscalemin);
          if (room.bgfiltergrayscalemax !== undefined) bg.dataset.gmax = String(room.bgfiltergrayscalemax);
        }
        loadImageForTile(room.image1, bg).then((dataUri) => {
          if (dataUri && room.useimagecolors === true) {
            extractPaletteFromDataUri(dataUri, 8).then(pal => {
              if (pal && pal.length) {
                IMAGE_PALETTES[id] = pal;
                // apply after switches are rendered below
                setTimeout(() => applyPaletteToRoom(room, pal), 0);
              }
            });
          }
        });
      }
      if (room.image2) {
        const bg2 = document.getElementById(id + '-bg2');
        if (bg2) {
          loadImageForTile(room.image2, bg2);
        }
      }

      // Hintergrund-Filter oder Fade bei 2. Bild
      try {
        const bgEl = document.getElementById(id + '-bg');
        if (bgEl) {
          if (room.image2enabled) {
            // Deaktiviere Filter, steuere Transparency von Bild 1 über bgfade
            bgEl.style.filter = '';
            const base = (typeof room.imagetransparency === 'number') ? room.imagetransparency : (parseFloat(bgEl.dataset.basealpha || '0.7') || 0.7);
            const fade = (typeof room.bgfade === 'number') ? Math.max(0, Math.min(100, room.bgfade)) : 0;
            const alpha = Math.max(0, Math.min(1, base * (1 - (fade / 100))));
            bgEl.style.opacity = String(alpha);
            bgEl.dataset.bgfilter = '0';
            bgEl.dataset.bgfade = String(fade);
          } else {
            // Klassischer Filter
            bgEl.style.opacity = '';
            let p = Number(room.bgfilter);
            if (!isFinite(p)) p = 0;
            p = Math.max(0, Math.min(100, p));
            bgEl.style.filter = p <= 0 ? '' : computeBgFilterString(p, bgEl);
            bgEl.dataset.bgfilter = String(p);
          }
        }
      } catch (_) {}

      // RoomName
      const rn = document.getElementById(id + '-roomname');
      if (rn && room.roomname !== undefined) rn.textContent = room.roomname;
      if (room.roomnamefontsize !== undefined) rn.style.fontSize = room.roomnamefontsize + 'px';
      if (room.roomnamefontcolor) rn.style.color = room.roomnamefontcolor;
      if (rn) rn.classList.toggle('hidden', room.showroomname === false);
      applyRoomNameAlign(root, room.roomnamealign);

      const hasDynamicInfo = Array.isArray(room.infoitems) && room.infoitems.length > 0;
      // Set centered flag for legacy mode handling
      root.dataset.topCentered = room.infotopcentered ? '1' : '0';
      if (hasDynamicInfo) {
        renderDynamicInfo(id, room);
      } else {
        if (room.infotopcentered) {
          ensureLegacyInfoStructureCentered(id);
        } else {
          ensureLegacyInfoStructure(id);
        }
        for (const k of ['infoleft','infoleft2','inforight','inforight2']) {
          applyInfo(id, k, room);
        }
        updateInfoContainerVisibility(id);
      }

      // Apply switch alignment
      setSwitchAlignment(id, room.switchalignment, !!room.switchdistribute);

      // Menu switch
      const menu = document.getElementById(id + '-menubar');
      if (menu) {
        if (room.menuswitch) menu.classList.remove('is-hidden'); else menu.classList.add('is-hidden');
      }

      const hasDynamicMenu = Array.isArray(room.menuitems) && room.menuitems.length > 0;
      if (hasDynamicMenu) {
        renderDynamicMenu(id, room);
      } else {
        ensureLegacyMenuStructure(id, room);
        for (let i = 1; i <= 5; i++) {
          applySwitch(id, i, room);
        }
        updateSingleButtonState(id);
        normalizeDistribute(id);
      }
      updateBadgeMinWidth(id);
      if (room.useimagecolors === true && IMAGE_PALETTES[id]) {
        applyPaletteToRoom(room, IMAGE_PALETTES[id]);
      }
    }

    function applyInfo(prefixId, key, roomObj) {
      const valKey = key; // fallback key if '...asso' is not provided
      const nameKey = key + 'name';
      const iconKey = key + 'icon';
      const assoKey = key + 'asso';

      let iconEl = document.getElementById(prefixId + '-' + key + 'icon');
      const nameEl = document.getElementById(prefixId + '-' + key + 'name');
      const colonEl = document.getElementById(prefixId + '-' + key + 'colon');
      const valEl = document.getElementById(prefixId + '-' + key + 'asso');

      if (!iconEl || !nameEl || !colonEl || !valEl) return;
      colonEl.textContent = ': ';

      try {
        const grp = iconEl.parentElement;
        const colorKey = key + 'color';
        if (grp) {
          const hasExplicit = roomObj && Object.prototype.hasOwnProperty.call(roomObj, colorKey);
          if (hasExplicit && roomObj[colorKey]) {
            applyBadgeBg(grp, roomObj[colorKey], roomObj);
          } else if (!key.startsWith('infoitem-')) {
            grp.style.backgroundColor = '';
          }
          // For dynamic infoitems without explicit color key, keep whatever renderDynamicInfo set
        }
      } catch (e) {}

      if (roomObj[nameKey]) { nameEl.textContent = roomObj[nameKey]; nameEl.classList.remove('hidden'); } else { nameEl.classList.add('hidden'); }
      let valueToShow = roomObj[assoKey];
      if (valueToShow === undefined || valueToShow === null || valueToShow === '') {
        valueToShow = roomObj[valKey];
      }
      if (valueToShow !== undefined && valueToShow !== null && valueToShow !== '') { valEl.textContent = valueToShow; valEl.classList.remove('hidden'); } else { valEl.classList.add('hidden'); }
      const showValFlag = (roomObj[key + 'showvalue'] !== undefined) ? !!roomObj[key + 'showvalue'] : true;
      valEl.dataset.showvalue = showValFlag ? '1' : '0';
      if (!showValFlag) { valEl.classList.add('hidden'); }
      colonEl.classList.toggle('hidden', nameEl.classList.contains('hidden') || valEl.classList.contains('hidden'));

      const showIconFlag = (roomObj[key + 'showicon'] !== undefined) ? !!roomObj[key + 'showicon'] : false;
      iconEl.dataset.showicon = showIconFlag ? '1' : '0';
      if (showIconFlag && roomObj[iconKey] && roomObj[iconKey] !== 'Transparent') {
        const cls = prepareIconClass(roomObj[iconKey]);
        iconEl = setIconElementById(prefixId + '-' + key + 'icon', cls ? (cls + ' info-icon') : 'hidden info-icon') || iconEl;
        if (iconEl && !(iconEl.className || '').includes('hidden')) {
          iconEl.style.display = '';
          ensureFaSvg(iconEl.parentElement || iconEl);
        }
      } else {
        iconEl.className = 'hidden info-icon';
        iconEl.style.display = 'none';
      }
      // After updating one info group, adjust styles and container visibility
      adjustIconSolo(prefixId, key);
      updateInfoContainerVisibility(prefixId);
      updateBadgeMinWidth(prefixId);
    }

    function applySwitch(prefixId, n, roomObj) {
      const base = prefixId + '-schalter' + n;
      let group = document.getElementById(base + '-group');
      const idx = roomObj.idx;
      const options = roomObj['schalter' + n + 'options'];
      const hasAction = !!roomObj['schalter' + n + 'hasaction'];
      const typeVal = roomObj['schalter' + n + 'type'];
      const openObjectId = Number(roomObj['schalter' + n + 'openobject'] || 0);
      const isObjectAction = openObjectId > 0;
      const shouldMulti = hasAction && (typeVal === 0 || (Array.isArray(options) && options.length > 0) || isObjectAction);
      const iconswitch = !!roomObj['switch' + n + 'iconswitch'];
      const fullWidth = !!roomObj['switch' + n + 'fullwidth'];

      // Ensure correct group type exists
      if (shouldMulti) {
        if (!group || !group.classList.contains('switch-group')) {
          const wrap = document.getElementById(base + '-group');
          const parent = wrap ? wrap.parentElement : document.getElementById(prefixId + '-switches');
          if (parent) {
            const newGroup = switchGroup(prefixId, idx, n);
            if (wrap) parent.insertBefore(newGroup, wrap), parent.removeChild(wrap);
            else parent.appendChild(newGroup);
            group = newGroup;
          }
        }
      } else {
        if (!group || group.classList.contains('switch-group')) {
          // replace switch-group with text group
          const parent = group ? group.parentElement : document.getElementById(prefixId + '-switches');
          if (parent) {
            const newGroup = groupSwitch(prefixId, n);
            if (group) parent.insertBefore(newGroup, group), parent.removeChild(group);
            else parent.appendChild(newGroup);
            group = newGroup;
          }
        }
      }

      // Apply full-width to the wrapper regardless of mode
      if (group) {
        group.classList.toggle('full-width', fullWidth);
      }

      // If options present, render multi-button
      if (group && Array.isArray(options) && options.length > 0 && shouldMulti && !isObjectAction) {
        const current = roomObj['schalter' + n + 'value'];
        const color = roomObj['schalter' + n + 'color'];
        const width = roomObj['switch' + n + 'width'];
        const showName = (roomObj['schalter' + n + 'showname'] !== undefined) ? roomObj['schalter' + n + 'showname'] : roomObj['Schalter' + n + 'ShowName'];
        const showValue = (roomObj['switch' + n + 'showvalue'] !== undefined) ? roomObj['switch' + n + 'showvalue'] : roomObj['Schalter' + n + 'ShowValue'];
        const showIcon = (roomObj['schalter' + n + 'showicon'] !== undefined) ? roomObj['schalter' + n + 'showicon'] : roomObj['Schalter' + n + 'ShowIcon'];
        renderSwitchGroup(prefixId, idx, n, options, current, color, width, iconswitch, showName, showValue, showIcon, fullWidth);
        return;
      }

      // Common element refs (works for both button and text group)
      const nameKey = 'schalter' + n + 'name';
      const altNameKey = 'switch' + n + 'altname';
      const iconKey = 'schalter' + n + 'icon';
      const assoKey = 'schalter' + n + 'asso';
      const colorKey = 'schalter' + n + 'color';
      const widthKey = 'switch' + n + 'width';
      const nameEl = document.getElementById(base + 'name');
      const colonEl = document.getElementById(base + 'colon');
      const valEl = document.getElementById(base + 'asso');
      const iconEl = document.getElementById(base + 'icon');

      // Name: AltName bevorzugt, sonst Name; anzeigen nur wenn einer gesetzt ist
      const displayName = roomObj[altNameKey] ? roomObj[altNameKey] : roomObj[nameKey];
      if (nameEl) { if (displayName) { nameEl.textContent = displayName; nameEl.classList.remove('hidden'); } else { nameEl.classList.add('hidden'); } }
      if (valEl) { if (roomObj[assoKey] || roomObj[assoKey] === 0) { valEl.textContent = roomObj[assoKey]; valEl.classList.remove('hidden'); } else { valEl.classList.add('hidden'); } }
      const showValSw = (roomObj['switch' + n + 'showvalue'] !== undefined) ? !!roomObj['switch' + n + 'showvalue'] : !!roomObj['Schalter' + n + 'ShowValue'];
      if (valEl) {
        valEl.dataset.showvalue = showValSw ? '1' : '0';
        valEl.classList.toggle('hidden', !showValSw || (!valEl.textContent && valEl.textContent !== '0'));
      }
      if (colonEl && nameEl && valEl) { colonEl.classList.toggle('hidden', nameEl.classList.contains('hidden') || valEl.classList.contains('hidden')); }
      
      // Show/hide group based on whether it has any visible content
      if (!shouldMulti && group) {
        const hasVisibleContent = (nameEl && !nameEl.classList.contains('hidden')) || (valEl && !valEl.classList.contains('hidden')) || (iconEl && !iconEl.classList.contains('hidden'));
        if (hasVisibleContent) { group.classList.remove('hidden'); } else { group.classList.add('hidden'); }
      }

      // If button mode
      if (shouldMulti) {
        const btn = document.getElementById(base);
        if (!btn) return;
        btn.classList.remove('hidden');
        btn.classList.toggle('full-width', fullWidth);
        if (fullWidth) { btn.style.width = ''; btn.style.minWidth = ''; }
        if (group) { group.classList.toggle('full-width', fullWidth); }
        else if (roomObj[widthKey]) { btn.style.minWidth = roomObj[widthKey] + 'px'; btn.style.width = ''; }
        const useImgCol3 = (roomObj.useimagecolors === true || GRID_FLAGS.useImageColorsForButtons);
        if (roomObj[colorKey] && !useImgCol3) { btn.style.backgroundColor = roomObj[colorKey]; btn.dataset.fallbackcolor = roomObj[colorKey]; }
        if (typeVal !== undefined) { btn.dataset.vartype = String(typeVal); } else { delete btn.dataset.vartype; }
        const colorOnKey = 'schalter' + n + 'colorOn';
        const colorOffKey = 'schalter' + n + 'colorOff';
        const colOn = roomObj[colorOnKey];
        const colOff = roomObj[colorOffKey];
        const useImgCol = (roomObj.useimagecolors === true || GRID_FLAGS.useImageColorsForButtons);
        // Profilfarben nur übernehmen, wenn Palettenfarben nicht aktiv
        if (!useImgCol) {
          if (colOn) btn.dataset.colorOn = colOn;
          if (colOff) btn.dataset.colorOff = colOff;
        }
        const rawVal = roomObj['schalter' + n + 'value'];
        if (rawVal !== undefined) {
          btn.dataset.currentValue = String(rawVal);
        } else {
          delete btn.dataset.currentValue;
        }
        if (typeVal === 0) {
          const isOn = (rawVal === true || String(rawVal) === '1');
          btn.classList.toggle('inactive', !isOn);
          const dsOn = btn.dataset ? btn.dataset.colorOn : '';
          const dsOff = btn.dataset ? btn.dataset.colorOff : '';
          const fb = btn.dataset ? btn.dataset.fallbackcolor : '';
          let bg = isOn
            ? (useImgCol ? (dsOn || fb || '') : (colOn || dsOn || fb || roomObj[colorKey] || ''))
            : (useImgCol ? (dsOff || fb || '') : (colOff || dsOff || fb || roomObj[colorKey] || ''));
          if (!bg && !useImgCol) bg = 'var(--accent-color)';
          btn.style.backgroundColor = bg;
        } else {
          btn.classList.remove('inactive');
        }
        const openId = Number(roomObj['schalter' + n + 'openobject'] || 0);
        if (isObjectAction) {
          btn.classList.add('object-action');
          btn.dataset.openobject = String(openObjectId);
          btn.onclick = (ev) => {
            ev.stopPropagation();
            if (typeof openObject === 'function') {
              openObject(openObjectId);
            }
          };
        } else {
          btn.classList.remove('object-action');
          delete btn.dataset.openobject;
        }
        const showNameSingle = (roomObj['schalter' + n + 'showname'] !== undefined)
          ? !!roomObj['schalter' + n + 'showname']
          : (roomObj['Schalter' + n + 'ShowName'] !== undefined ? !!roomObj['Schalter' + n + 'ShowName'] : true);
        const showValueSingle = (roomObj['switch' + n + 'showvalue'] !== undefined) ? !!roomObj['switch' + n + 'showvalue'] : !!roomObj['Schalter' + n + 'ShowValue'];
        btn.classList.toggle('hide-labels', !showNameSingle);
        btn.classList.toggle('hide-values', !showValueSingle);
        // Icon for button
        if (iconEl) {
          if (iconswitch && roomObj[iconKey] && roomObj[iconKey] !== 'Transparent') {
            const cls = prepareIconClass(roomObj[iconKey]);
            if (cls) {
              iconEl.className = cls + ' switch-icon';
              ensureFaSvg(iconEl.parentElement || iconEl);
            } else {
              iconEl.className = 'hidden switch-icon';
            }
          } else {
            iconEl.className = 'hidden switch-icon';
          }
        }
      } else {
        // Text-mode icon
        if (iconEl) {
          if (iconswitch && roomObj[iconKey] && roomObj[iconKey] !== 'Transparent') {
            const cls = prepareIconClass(roomObj[iconKey]);
            if (cls) {
              iconEl.className = cls + ' info-icon';
              ensureFaSvg(iconEl.parentElement || iconEl);
            } else {
              iconEl.className = 'hidden info-icon';
            }
          } else {
            iconEl.className = 'hidden info-icon';
          }
        }
      }
    }

    function updateRoomKey(idx, key, value) {
      const id = 'room-' + idx;
      if (key === 'targetlink' || key === 'Target') {
        const root = document.getElementById(id);
        if (root) {
          const menuEl = document.getElementById(id + '-menubar');
          if (menuEl) menuEl.onclick = (e) => { e.stopPropagation(); };
          root.onclick = null;
          if (value && Number(value) > 0 && typeof openObject === 'function') {
            const target = Number(value);
            root.style.cursor = 'pointer';
            root.onclick = () => openObject(target);
          } else {
            root.style.cursor = '';
          }
        }
        return;
      }
      
      // Background image
      if (key === 'image1') {
        const bg = document.getElementById(id + '-bg');
        if (bg) {
          loadImageForTile(value, bg).then((dataUri) => {
            const root = document.getElementById(id);
            const use = root && root.__useImageColors === true ? true : undefined; // legacy, not used
            // We don't have the full room here, so only recolor if we have a stored palette or can extract a new one.
            if (dataUri) {
              extractPaletteFromDataUri(dataUri, 8).then(pal => {
                if (pal && pal.length) {
                  IMAGE_PALETTES[id] = pal;
                  // Try to infer room object from DOM cache: not available; palette will be applied on next full update.
                }
              });
            }
            // Re-apply cached bgfilter after image has loaded (or disable if second image is active)
            try {
              const cached = bg && bg.dataset ? Number(bg.dataset.bgfilter) : 0;
              let p = isFinite(cached) ? cached : 0;
              p = Math.max(0, Math.min(100, p));
              if (bg) {
                const img2 = (bg.dataset && bg.dataset.image2enabled === '1');
                bg.style.filter = img2 ? '' : (p <= 0 ? '' : computeBgFilterString(p, bg));
              }
            } catch (_) {}
          });
        }
        return;
      }
      if (key === 'image2') {
        const bg2 = document.getElementById(id + '-bg2');
        if (bg2) {
          loadImageForTile(value, bg2);
        }
        // Note: image2enabled flag is set by explicit 'image2enabled' delta from backend
        // Do not automatically assume image2enabled=1 just because image2 URL exists

            const f = Math.max(0, Math.min(100, Number(bg.dataset.bgfade || 0)));
            const alpha = Math.max(0, Math.min(1, base * (1 - (f / 100))));

    function setGridLayout(minWidth, minHeight, gap, borderRadius, columns) {

        grid.style.gridTemplateColumns = `repeat(${Number(columns)}, 1fr)`;
      } else {
        // restore default CSS rule
        grid.style.gridTemplateColumns = '';
      }
    }

    function handleMessage(data) {
      const decoded = typeof data === 'string' ? JSON.parse(data) : (data || {});

      if (decoded.grid) {
        try {
          const cs = window.getComputedStyle(document.body);
          if (ORIGINAL_BODY_MARGIN_TOP === null) {
            ORIGINAL_BODY_MARGIN_TOP = cs.marginTop || '';
          }
          const useFull = !!decoded.grid.useFullTileHeight;
          const customMargin = Number(decoded.grid.customMargin ?? -1);

          if (customMargin > -1) {
            const cm = customMargin + 'px';
            if (useFull) {
              // alle Ränder auf den angegebenen Wert
              document.body.style.marginTop = cm;
              document.body.style.marginLeft = cm;
              document.body.style.marginRight = cm;
              document.body.style.marginBottom = cm;
            } else {
              // top = Originalwert, left/right/bottom = Custom Margin
              document.body.style.marginTop = ORIGINAL_BODY_MARGIN_TOP;
              document.body.style.marginLeft = cm;
              document.body.style.marginRight = cm;
              document.body.style.marginBottom = cm;
            }
          } else {
            // kein Custom-Wert: bisheriges Verhalten
            if (useFull) {
              const ml = cs.marginLeft || '';
              if (ml !== '') {
                document.body.style.marginTop = ml;
              }
            } else {
              document.body.style.marginTop = ORIGINAL_BODY_MARGIN_TOP;
            }
          }
        } catch (e) {}
        setGridLayout(decoded.grid.minWidth, decoded.grid.minHeight, decoded.grid.gap, decoded.grid.borderRadius, decoded.grid.columns);
        GRID_FLAGS.useImageColorsForButtons = !!decoded.grid.useImageColorsForButtons;
        if ('transparentStatusColors' in decoded.grid) {
          GRID_FLAGS.transparentStatusColors = !!decoded.grid.transparentStatusColors;
        }
        if ('transparentMenuStatusColors' in decoded.grid) {
          GRID_FLAGS.transparentMenuStatusColors = !!decoded.grid.transparentMenuStatusColors;
        }
        if ('groupMenuInfoElements' in decoded.grid) {
          GRID_FLAGS.groupMenuInfoElements = !!decoded.grid.groupMenuInfoElements;
        }
      }

      if (decoded.rooms) {
        // Full render
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        decoded.rooms.forEach(r => {
          const t = ensureTile(r);
          applyRoomState(r);
        });
        return;
      }

      if (decoded.delta) {
        for (const d of decoded.delta) {
          updateRoomKey(d.idx, d.key, d.value);
        }
        return;
      }
    }
  </script>
</body>
